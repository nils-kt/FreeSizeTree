<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>FreeSizeTree</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="aurora"></div>
  <aside class="nav">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
          <circle cx="16" cy="16" r="13" fill="none" stroke="url(#lg)" stroke-width="5" stroke-dasharray="52 30" stroke-linecap="round" transform="rotate(-90 16 16)"/>
          <circle cx="16" cy="16" r="5" fill="url(#lg)"/></svg>
      </div>
      <div class="brand-text"><b>FreeSizeTree</b><span>Speicher aufräumen</span></div>
    </div>
    <nav id="navlist"></nav>
    <div class="nav-foot" id="navfoot"></div>
  </aside>
  <main>
    <div class="scanbar" id="scanbar"><i></i></div>
    <div id="view"></div>
  </main>
  <div id="tooltip"></div>
  <div id="menu"></div>
  <div id="modal"></div>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
